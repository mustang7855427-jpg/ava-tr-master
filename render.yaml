# Free plans are for testing only: the web service sleeps when idle and the
# Key Value instance does not persist data across restarts.
services:
  - type: web
    name: avataria-web
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: python -m pip install -r requirements-render.txt
    startCommand: python -u render_start.py
    healthCheckPath: /
    envVars:
      - key: RENDER_DEPLOYMENT
        value: "true"
      - key: WEB_BIND_HOST
        value: 0.0.0.0
      - key: GAME_BIND_HOST
        value: 127.0.0.1
      - key: GAME_SERVER_HOST
        value: 127.0.0.1
      - key: GAME_ASSETS_URL
        value: https://cdn.jsdelivr.net/gh/mustang7855427-jpg/avataria-serwer@main/demo-assets/
      - key: RUFFLE_BASE_URL
        value: https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@0.7.1/
      - key: DEMO_MODE
        value: "true"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: avataria-data
          property: connectionString
      - key: OWNER_UID
        sync: false
      - key: TRUSTED_PROXY_CIDRS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  - type: keyvalue
    name: avataria-data
    plan: free
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: noeviction
